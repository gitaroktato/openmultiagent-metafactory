project_name: "Open Metadata-Agent Metafactory"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: []
definition_of_done: ["All unit tests pass", "Unit test coverage stays above 80%", "The `knip` linter shows no errors or issues to fix", "README.md documentation is updated"]
date_format: yyyy-mm-dd
max_column_width: 20
default_editor: "nvim"
auto_open_browser: true
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
zero_padded_ids: 4
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "OMA"
